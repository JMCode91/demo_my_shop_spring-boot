<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Contacto - My Shop')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

<header th:replace="~{fragments/header}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="text-center mb-5">
                <h1 class="fw-bold">Contacta con nosotros</h1>
                <p class="text-muted fs-5">¿Tienes alguna duda sobre tu pedido? Estamos aquí para ayudarte.</p>
            </div>

            <div class="row g-4">
                <!-- Información de Contacto -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm rounded-4 h-100 bg-primary text-white p-4 p-lg-5">
                        <h4 class="fw-bold mb-4">Información</h4>
                        
                        <div class="d-flex align-items-start mb-4">
                            <span class="fs-4 me-3">📍</span>
                            <div>
                                <h6 class="fw-bold mb-1">Nuestra oficina</h6>
                                <p class="mb-0 opacity-75 small">Avenida de las Cortes Valencianas<br>46015, Valencia</p>
                            </div>
                        </div>

                        <div class="d-flex align-items-start mb-4">
                            <span class="fs-4 me-3">📧</span>
                            <div>
                                <h6 class="fw-bold mb-1">Email</h6>
                                <p class="mb-0 opacity-75 small">soporte@myshop.demo</p>
                            </div>
                        </div>

                        <div class="d-flex align-items-start">
                            <span class="fs-4 me-3">📞</span>
                            <div>
                                <h6 class="fw-bold mb-1">Teléfono</h6>
                                <p class="mb-0 opacity-75 small">+34 900 123 456<br>L-V de 9:00h a 18:00h</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario -->
                <div class="col-md-7">
                    <div class="card border-0 shadow-sm rounded-4 h-100 p-4 p-lg-5">
                        <form action="/" method="get">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label text-muted small fw-bold">Nombre</label>
                                    <input type="text" class="form-control bg-light border-0" placeholder="Tu nombre" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label text-muted small fw-bold">Email</label>
                                    <input type="email" class="form-control bg-light border-0" placeholder="tu@email.com" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold">Asunto</label>
                                    <input type="text" class="form-control bg-light border-0" placeholder="Referencia del pedido o consulta" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold">Mensaje</label>
                                    <textarea class="form-control bg-light border-0" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-outline-secondary text-body w-100 fw-bold py-2 rounded-pill shadow-sm">
                                        Enviar mensaje
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer}"></footer>

</body>
</html>
