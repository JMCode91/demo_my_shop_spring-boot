<!doctype html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/head :: head(title='My Shop')"></head>
<body> <header th:replace="fragments/header"></header>

<main>
    <section th:replace="fragments/section-catalog"></section>

    <div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="col" th:each="product : ${products}">

                    <div class="card shadow-sm h-100 border-0">

                        <img th:src="@{'/images/' + ${product.image}}" class="card-img-top p-3" alt="Imagen del producto" style="height: 250px; object-fit: contain;">

                        <div class="card-body d-flex flex-column">

                            <h5 class="card-title fw-bold" th:text="${product.name}"></h5>
                            <p class="card-text text-body-secondary mb-4" th:text="${product.description}"></p>

                            <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                                <div class="btn-group">
                                    <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary">
                                        Ver
                                    </a>
                                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="d-inline m-0">
                                        <button type="submit" class="btn btn-sm btn-primary shadow-sm">
                                            🛒 Añadir
                                        </button>
                                    </form>
                                </div>
                                <strong class="text-success fs-5" th:text="${product.price} + ' €'"></strong>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>

</body>
</html>
