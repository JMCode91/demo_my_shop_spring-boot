<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='My Shop - Inicio')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary"> 

<header th:replace="~{fragments/header}"></header>

<main>
    <div class="container py-4 mt-2">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card text-white border-0 shadow-sm h-100 rounded-4 overflow-hidden banner-hover" style="background: linear-gradient(135deg, #0d6efd, #0043a8);">
                    <div class="card-body p-5 d-flex flex-column justify-content-center align-items-center text-center">
                        <h2 class="fw-bold mb-3">SEMANA GAMING</h2>
                        <p class="mb-4">Hasta -30% en portátiles y periféricos.</p>
                        <a href="/category/consolas" class="btn btn-light rounded-pill px-4 fw-bold text-primary shadow-sm">Ver ofertas</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card text-dark border-0 shadow-sm h-100 rounded-4 overflow-hidden banner-hover" style="background: linear-gradient(135deg, #ffc107, #fd7e14);">
                    <div class="card-body p-5 d-flex flex-column justify-content-center align-items-center text-center">
                        <h2 class="fw-bold mb-3">DÍAS SIN IVA</h2>
                        <p class="mb-4 fw-medium">En grandes electrodomésticos.</p>
                        <a href="/category/electrodomesticos" class="btn btn-dark rounded-pill px-4 fw-bold shadow-sm">Aprovechar</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card text-white border-0 shadow-sm h-100 rounded-4 overflow-hidden banner-hover" style="background: linear-gradient(135deg, #20c997, #0ca678);">
                    <div class="card-body p-5 d-flex flex-column justify-content-center align-items-center text-center">
                        <h2 class="fw-bold mb-3">NOVEDADES</h2>
                        <p class="mb-4">Descubre lo último en telefonía móvil.</p>
                        <a href="/category/telefonia" class="btn btn-light rounded-pill px-4 fw-bold text-success shadow-sm">Descubrir</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="album pb-5 pt-4 bg-body-tertiary flex-grow-1">
        <div class="container">
            <h3 class="mb-4 fw-bold text-dark">🔥 Destacados de hoy</h3>
            
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <div class="col" th:each="product : ${products}">
                    <div class="card shadow-sm h-100 border-0 position-relative card-hover rounded-4 overflow-hidden">

                        <div th:if="${product.discount > 0}" class="position-absolute top-0 start-0 m-2 z-1">
                            <span class="badge bg-danger fs-6 px-2 py-1 shadow-sm rounded-1" style="font-weight: 900;" th:text="'-' + ${#numbers.formatDecimal(product.discount, 0, 0)} + '%'"></span>
                        </div>

                        <img th:if="${product.image != null and product.image.startsWith('http')}"
                             th:src="${product.image}" class="card-img-top p-4" alt="Imagen del producto" style="height: 220px; object-fit: contain;">

                        <img th:if="${product.image != null and !product.image.startsWith('http')}"
                             th:src="@{'/images/' + ${product.image}}" class="card-img-top p-4" alt="Imagen del producto" style="height: 220px; object-fit: contain;">

                        <div class="card-body d-flex flex-column pt-0">
                            
                            <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem; letter-spacing: 1px;" th:text="${product.category}"></span>
                            <h6 class="card-title fw-bold mt-1 mb-3 text-dark" th:text="${product.name}" style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></h6>

                            <div class="d-flex justify-content-between align-items-end mt-auto pt-3 border-top">
                                
                                <div class="btn-group">
                                    <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary fw-bold" style="border-radius: 4px 0 0 4px;">Ver</a>
                                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="d-inline m-0">
                                        <button type="submit" class="btn btn-sm btn-primary fw-bold shadow-sm" style="border-radius: 0 4px 4px 0;">🛒 Añadir</button>
                                    </form>
                                </div>
                                
                                <div class="text-end">
                                    <div th:if="${product.discount > 0}" class="text-muted text-decoration-line-through mb-0" style="font-size: 0.85rem; line-height: 1;">
                                        <span th:text="${product.price} + ' €'"></span>
                                    </div>
                                    <strong class="fs-4 fw-bold lh-1 text-dark" th:text="${product.finalPrice} + ' €'"></strong>
                                    <div class="text-muted mt-1" style="font-size: 0.65rem;">IVA incluido</div>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-5">
                <a href="/search" class="btn btn-outline-dark fw-bold px-4 py-2 rounded-pill shadow-sm">Ver todo el catálogo completo</a>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer}"></footer>

</body>
</html>
