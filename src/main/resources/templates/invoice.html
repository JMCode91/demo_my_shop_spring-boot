<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* Estilos incrustados obligatorios para que el motor de PDF los lea */
        body { font-family: 'Arial', sans-serif; color: #333; margin: 0; padding: 0; }
        .invoice-box { max-width: 800px; margin: auto; padding: 30px; font-size: 14px; line-height: 24px; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .title { font-size: 32px; font-weight: bold; color: #0d6efd; }
        table { width: 100%; line-height: inherit; text-align: left; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .total-section { margin-top: 30px; text-align: right; }
        .total-row td { font-weight: bold; font-size: 18px; border-top: 2px solid #eee; }
    </style>
</head>
<body>
    <div class="invoice-box">
        <div class="header">
            <table>
                <tr>
                    <td class="title">MY SHOP S.L.</td>
                    <td style="text-align: right;">
                        Factura #: <span th:text="${order.id}">001</span><br/>
                        Fecha: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">01/01/2024</span>
                    </td>
                </tr>
            </table>
        </div>

        <table style="margin-bottom: 40px;">
            <tr>
                <td>
                    <strong>Emisor:</strong><br/>
                    My Shop S.L.<br/>
                    CIF: B12345678<br/>
                    Calle Falsa 123, Madrid
                </td>
                <td style="text-align: right;">
                    <strong>Cliente:</strong><br/>
                    <span th:text="${order.user.name}">Nombre Cliente</span><br/>
                    <span th:text="${order.user.email}">Email Cliente</span>
                </td>
            </tr>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th style="text-align: center;">Cant.</th>
                    <th style="text-align: right;">Precio Unit.</th>
                    <th style="text-align: right;">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="detail : ${order.details}">
                    <td th:text="${detail.product.name}">Producto</td>
                    <td style="text-align: center;" th:text="${detail.quantity}">1</td>
                    <td style="text-align: right;" th:text="${detail.price} + ' €'">0.00 €</td>
                    <td style="text-align: right;" th:text="${detail.price * detail.quantity} + ' €'">0.00 €</td>
                </tr>
            </tbody>
        </table>

        <div class="total-section">
            <table>
                <tr>
                    <td style="text-align: right; width: 80%;">Base Imponible:</td>
                    <td style="text-align: right;" th:text="${order.subtotal} + ' €'">0.00 €</td>
                </tr>
                <tr class="total-row">
                    <td style="text-align: right;">TOTAL (IVA INC.):</td>
                    <td style="text-align: right; color: #0d6efd;" th:text="${order.price} + ' €'">0.00 €</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
