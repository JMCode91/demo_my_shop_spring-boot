<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Gestión de Usuario')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary"> 

<header th:replace="~{fragments/header}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-body">

                <div class="card-header bg-dark text-white text-center py-4 border-0">
                    <h3 class="mb-0 fw-bold" th:text="${user.id != null and user.id != 0} ? '✏️ Editar Usuario' : '👤 Registro de Cuenta'"></h3>
                </div>

                <div class="card-body p-4 p-md-5">

                    <form class="row g-3" th:object="${user}" method="post"
                          th:action="${user.id != null and user.id != 0} ? @{/admin/users/save} : @{/new-user}">

                        <input type="hidden" th:field="*{id}">

                        <h5 class="text-primary border-bottom border-secondary-subtle pb-2 mb-3 fw-bold">Datos de Acceso</h5>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Usuario</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{username}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">E-mail</label>
                            <input type="email" class="form-control bg-body-secondary border-0 text-body" th:field="*{email}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Contraseña</label>
                            <input type="password" class="form-control bg-body-secondary border-0 text-body" th:field="*{password}" th:required="${user.id == null or user.id == 0}">
                        </div>

                        <h5 class="text-primary border-bottom border-secondary-subtle pb-2 mt-4 mb-3 fw-bold">Datos Personales</h5>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Nombre</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{name}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">Apellidos</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{surname}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted small">NIF/DNI</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{nif}">
                        </div>

                        <h5 class="text-primary border-bottom border-secondary-subtle pb-2 mt-4 mb-3 fw-bold">Localización</h5>
                        <div class="col-md-12">
                            <label class="form-label fw-bold text-muted small">Dirección completa</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{address}">
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label fw-bold text-muted small">Ciudad</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{city}">
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label fw-bold text-muted small">Código Postal</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{postalCode}">
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label fw-bold text-muted small">Provincia</label>
                            <input type="text" class="form-control bg-body-secondary border-0 text-body" th:field="*{province}">
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label fw-bold text-muted small">País</label>
                            <select class="form-select bg-body-secondary border-0 text-body" id="country" th:field="*{country}">
                                <option value="">Cargando países...</option>
                            </select>
                        </div>

                        <div class="col-12 mt-4 p-3 bg-body-secondary rounded-3 border border-secondary-subtle" th:if="${user.id != null and user.id != 0}">
                            <div class="form-check form-switch fs-5 mb-1">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label fw-bold text-body" for="active">Cuenta Activa (Permitir acceso)</label>
                            </div>
                            <small class="text-muted">Si desactivas esta opción, el usuario no podrá iniciar sesión en la tienda.</small>
                        </div>

                        <hr class="border-secondary opacity-25 my-4">

                        <div class="col-12 mt-2 d-flex justify-content-center gap-3">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary text-body rounded-pill px-4 fw-bold">Cancelar</a>
                            <button class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm" type="submit">Guardar Datos</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer}"></footer>

<script th:src="@{/js/register.js}"></script>

</body>
</html>
