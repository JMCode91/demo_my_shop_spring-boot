<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='Gestión de Usuario')"></head>
<body class="bg-light">

<header th:replace="fragments/header"></header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-lg border-0 rounded-lg">

                <div class="card-header bg-dark text-white text-center py-3">
                    <h3 class="mb-0" th:text="${user.id != null and user.id != 0} ? '✏️ Editar Usuario' : '👤 Registro de nuevo usuario'"></h3>
                </div>

                <div class="card-body p-4 p-md-5">

                    <form class="row g-3" th:object="${user}" method="post"
                          th:action="${user.id != null and user.id != 0} ? @{/admin/users/save} : @{/new-user}">

                        <input type="hidden" th:field="*{id}">

                        <h5 class="text-primary border-bottom pb-2 mb-3 mt-0">Datos de Cuenta</h5>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">E-mail</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{password}" th:required="${user.id == null or user.id == 0}">
                        </div>

                        <h5 class="text-primary border-bottom pb-2 mt-4 mb-3">Datos Personales</h5>
                        <div class="col-md-4">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Apellidos</label>
                            <input type="text" class="form-control" th:field="*{surname}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">NIF/DNI</label>
                            <input type="text" class="form-control" th:field="*{nif}">
                        </div>

                        <h5 class="text-primary border-bottom pb-2 mt-4 mb-3">Localización</h5>
                        <div class="col-md-12">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" th:field="*{address}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Ciudad</label>
                            <input type="text" class="form-control" th:field="*{city}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Código Postal</label>
                            <input type="text" class="form-control" th:field="*{postalCode}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Provincia</label>
                            <input type="text" class="form-control" th:field="*{province}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">País</label>
                            <input type="text" class="form-control" th:field="*{country}">
                        </div>

                        <div class="col-12 mt-4" th:if="${user.id != null and user.id != 0}">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label" for="active">Cuenta Activa (Permitir acceso)</label>
                            </div>
                            <small class="text-muted">Si desactivas esta opción, el usuario no podrá iniciar sesión.</small>
                        </div>

                        <div class="col-12 mt-5 text-center">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 me-2">Cancelar</a>
                            <button class="btn btn-primary px-5" type="submit">Guardar Datos</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>
</body>
</html>
