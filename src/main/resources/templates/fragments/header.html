<header xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
    <div class="navbar bg-dark shadow-sm py-3" data-bs-theme="dark">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">

            <a th:href="@{/}" class="navbar-brand d-flex align-items-center me-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" class="me-2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <strong>My Shop</strong>
            </a>

            <form action="/search" method="get" class="d-flex flex-grow-1 mx-md-4 mb-3 mb-md-0 shadow-sm" style="max-width: 600px;">
                <input type="text" name="query" class="form-control border-0 rounded-start bg-light text-dark" placeholder="¿Qué estás buscando?">
                <button type="submit" class="btn btn-secondary px-4 rounded-end fw-bold">
                    🔍 
                </button>
            </form>

            <div class="text-end d-flex align-items-center justify-content-end">

                <button class="btn btn-sm btn-outline-light me-3 rounded-circle d-flex align-items-center justify-content-center"
                        id="themeToggle" title="Cambiar modo"
                        style="width: 35px; height: 35px; line-height: 0; padding: 0;">
                    🌙
                </button>

                <div sec:authorize="!isAuthenticated()" class="me-3">
                    <a href="/registration" class="btn btn-outline-light me-2">Registrarse</a>
                    <a href="/login" class="btn btn-primary">Iniciar sesión</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center me-3">
                    <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/panel}" class="text-info text-decoration-none me-3">
                        Hola, <strong sec:authentication="name"></strong>
                    </a>
                    <span sec:authorize="!hasAuthority('ADMIN')" class="text-light me-3">
                        Hola, <strong sec:authentication="name"></strong>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Salir</button>
                    </form>
                </div>

                <a href="/cart" class="btn btn-outline-info">
                    🛒 Cesta
                    <span class="badge bg-danger rounded-pill"
                          th:if="${session.carrito != null}"
                          th:text="${session.carrito.size()}">0</span>
                </a>
            </div>
        </div>
    </div>

    <div class="py-2" style="background-color: #212529; border-top: 1px solid #3b3f45;">
        <div class="container">
            <ul class="nav justify-content-center text-uppercase" style="font-size: 0.85rem; font-weight: 600;">
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/electrodomesticos">Electrodomésticos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/informatica">Informática</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/telefonia">Telefonía</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/television">Televisión</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/pequeno-electrodomestico">Pequeño Electrodoméstico</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light px-3 link-hover-primary" href="/category/consolas">Consolas y Videojuegos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 link-hover-primary" href="/ofertas" style="color: #ffc107 !important; font-weight: bold;">Ofertas</a>
                </li>
            </ul>
        </div>
    </div>

    <style>
        .link-hover-primary { transition: color 0.2s ease; }
        .link-hover-primary:hover { color: #0d6efd !important; } /* Azul Primary */
    </style>
</header>
