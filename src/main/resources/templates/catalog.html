<!doctype html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/head :: head(title='Catálogo de Productos')"></head>
<body> 

<header th:replace="fragments/header"></header>

<main class="bg-body-tertiary py-5">
    <div class="container">
        <h2 class="fw-bold mb-4" th:text="${pageTitle}">Catálogo</h2>

        <div class="row">
            <div class="col-lg-3 d-none d-lg-block">
                <form action="/search" method="get" class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 20px;">
                    <h5 class="fw-bold mb-3">Filtros</h5>
                    
                    <input type="hidden" name="query" th:if="${currentQuery != null}" th:value="${currentQuery}">
                    <input type="hidden" name="category" th:if="${currentCategory != null}" th:value="${currentCategory}">
                    
                    <h6 class="fw-bold mt-4 mb-2">Marcas</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="brands" value="Apple" id="brandApple" th:checked="${param.brands != null and #lists.contains(param.brands, 'Apple')}">
                        <label class="form-check-label text-muted" for="brandApple">Apple</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="brands" value="Samsung" id="brandSamsung" th:checked="${param.brands != null and #lists.contains(param.brands, 'Samsung')}">
                        <label class="form-check-label text-muted" for="brandSamsung">Samsung</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="brands" value="Sony" id="brandSony" th:checked="${param.brands != null and #lists.contains(param.brands, 'Sony')}">
                        <label class="form-check-label text-muted" for="brandSony">Sony</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="brands" value="Nintendo" id="brandNintendo" th:checked="${param.brands != null and #lists.contains(param.brands, 'Nintendo')}">
                        <label class="form-check-label text-muted" for="brandNintendo">Nintendo</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
                        <h6 class="fw-bold m-0">Precio Máximo</h6>
                        <span id="priceValue" class="badge bg-primary rounded-pill" th:text="${param.maxPrice != null ? param.maxPrice + ' €' : '2000 €'}">2000 €</span>
                    </div>
                    <input type="range" class="form-range" name="maxPrice" min="0" max="2000" step="50" id="priceRange" 
                           th:value="${param.maxPrice != null ? param.maxPrice : 2000}" 
                           oninput="document.getElementById('priceValue').innerText = this.value + ' €'">
                    <div class="d-flex justify-content-between text-muted small mt-1">
                        <span>0€</span>
                        <span>2000€</span>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4 rounded-pill fw-bold">Aplicar Filtros</button>
                </form>
            </div>

            <div class="col-lg-9">
                <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning text-center rounded-4 shadow-sm py-4">
                    <h4 class="fw-bold mb-2">¡Vaya! No encontramos nada.</h4>
                    <p class="mb-0">Prueba a buscar con otras palabras o navega por el menú superior.</p>
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
                    <div class="col" th:each="product : ${products}">
                        <div class="card shadow-sm h-100 border-0 position-relative card-hover rounded-4 overflow-hidden">
                            
                            <div th:if="${product.discount > 0}" class="position-absolute top-0 start-0 m-2 z-1">
                                <span class="badge bg-danger fs-6 px-2 py-1 shadow-sm rounded-1 fw-bold" th:text="'-' + ${#numbers.formatDecimal(product.discount, 0, 0)} + '%'"></span>
                            </div>

                            <img th:if="${product.image != null and product.image.startsWith('http')}" th:src="${product.image}" class="card-img-top p-4" alt="Imagen" style="height: 200px; object-fit: contain;">
                            <img th:if="${product.image != null and !product.image.startsWith('http')}" th:src="@{'/images/' + ${product.image}}" class="card-img-top p-4" alt="Imagen" style="height: 200px; object-fit: contain;">

                            <div class="card-body d-flex flex-column pt-0">
                                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem; letter-spacing: 1px;" th:text="${product.category}"></span>
                                <h6 class="card-title fw-bold mt-1 mb-3" th:text="${product.name}" style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></h6>

                                <div class="d-flex justify-content-between align-items-end mt-auto pt-3 border-top">
                                    <div class="btn-group">
                                        <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary fw-bold" style="border-radius: 4px 0 0 4px;">Ver</a>
                                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="d-inline m-0">
                                            <button type="submit" class="btn btn-sm btn-primary fw-bold shadow-sm" style="border-radius: 0 4px 4px 0;">🛒 Añadir</button>
                                        </form>
                                    </div>
                                    <div class="text-end">
                                        <div th:if="${product.discount > 0}" class="text-muted text-decoration-line-through mb-0" style="font-size: 0.85rem; line-height: 1;">
                                            <span th:text="${product.price} + ' €'"></span>
                                        </div>
                                        <strong class="fs-4 fw-bold lh-1" th:text="${product.finalPrice} + ' €'"></strong>
                                        <div class="text-muted mt-1" style="font-size: 0.65rem;">IVA incluido</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>

<style>
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1) !important; }
</style>
</body>
</html>
