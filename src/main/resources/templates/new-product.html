<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Nuevo Producto - Panel Admin')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 mt-3">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0">📦 Añadir Nuevo Producto al Inventario</h4>
                </div>
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">

                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{image}">


                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nombre del Producto</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Ej: Teclado Mecánico" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Categoría</label>
                                <input type="text" th:field="*{category}" class="form-control" placeholder="Ej: Periféricos">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Precio (€)</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Descuento (%)</label>
                                <input type="number" th:field="*{discount}" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Impuestos (%)</label>
                                <input type="number" th:field="*{taxes}" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Subir Imagen</label>
                                <input type="file" name="imageFile" class="form-control" accept="image/*">
                            </div>

                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{visible}" id="visibleCheck">
                                    <label class="form-check-label fw-bold" for="visibleCheck">Visible</label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-grid gap-3 d-md-flex justify-content-md-end">
                            <a href="/admin/panel" class="btn btn-outline-secondary px-4">Cancelar y Volver</a>
                            <button type="submit" class="btn btn-primary px-4">Guardar Producto</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
