<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Gestión de Producto - Panel Admin')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

<header th:replace="~{fragments/header}"></header>

<main class="container mt-5 mb-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8 mt-3">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white py-4 border-0">
                    <h4 class="mb-0 fw-bold">📦 Añadir / Editar Producto</h4>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">

                    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">

                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{image}"> <div class="row mb-3 g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold text-muted small">Nombre del Producto</label>
                                <input type="text" th:field="*{name}" class="form-control bg-light border-0" placeholder="Ej: Teclado Mecánico" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small">Categoría</label>
                                <input type="text" th:field="*{category}" class="form-control bg-light border-0" placeholder="Ej: Informatica">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="brand" class="form-label fw-bold text-muted small">Marca</label>
                            <input type="text" class="form-control bg-light border-0" id="brand" th:field="*{brand}" placeholder="Ej: Apple, Samsung, Sony...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Descripción Corta</label>
                            <textarea th:field="*{description}" class="form-control bg-light border-0" rows="2"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="technicalDescription" class="form-label fw-bold text-muted small">Características Técnicas</label>
                            <textarea class="form-control bg-light border-0" id="technicalDescription" th:field="*{technicalDescription}" rows="3" placeholder="Ej: Pantalla 6.8, 12GB RAM, 256GB..."></textarea>
                        </div>

                        <div class="row mb-4 g-3">
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">Precio (€)</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control bg-light border-0" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">Descuento (%)</label>
                                <input type="number" step="0.1" th:field="*{discount}" class="form-control bg-light border-0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">Impuestos (%)</label>
                                <input type="number" step="0.1" th:field="*{taxes}" class="form-control bg-light border-0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control bg-light border-0" required>
                            </div>
                        </div>

                        <div class="bg-body-tertiary p-4 rounded-4 mb-4 border">
                            <h6 class="fw-bold mb-3 text-dark">📸 Gestión de Imágenes</h6>
                            
                            <div class="mb-3">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="imageSource" id="sourceFile" value="file" checked onchange="toggleImageInputs()">
                                    <label class="form-check-label fw-bold small text-muted" for="sourceFile">Subir Archivo Físico</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="imageSource" id="sourceUrl" value="url" onchange="toggleImageInputs()">
                                    <label class="form-check-label fw-bold small text-muted" for="sourceUrl">Usar URL Externa</label>
                                </div>
                            </div>

                            <div id="fileInputContainer" class="mb-3">
                                <label class="form-label fw-bold text-muted small">Imagen Principal (Archivo)</label>
                                <input type="file" name="imageFile" class="form-control bg-white" accept="image/*">
                            </div>

                            <div id="urlInputContainer" class="mb-3 d-none">
                                <label class="form-label fw-bold text-muted small">Imagen Principal (URL)</label>
                                <input type="url" name="imageUrl" class="form-control bg-white" placeholder="https://ejemplo.com/imagen.jpg">
                            </div>

                            <div class="mt-4 pt-3 border-top">
                                <label class="form-label fw-bold text-muted small">Galería (URLs adicionales separadas por comas)</label>
                                <textarea name="galleryUrls" class="form-control bg-white" rows="2" placeholder="https://img1.jpg, https://img2.jpg..."></textarea>
                                <small class="text-muted" style="font-size: 0.7rem;">Si tu base de datos soporta galería, estas imágenes crearán el carrusel.</small>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" th:field="*{visible}" id="visibleCheck">
                                <label class="form-check-label fw-bold small text-dark" for="visibleCheck">Producto Visible</label>
                            </div>
                            
                            <div class="d-flex gap-3">
                                <a href="/admin/panel" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">Cancelar</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Guardar Producto</button>
                            </div>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer}"></footer>

<script>
    function toggleImageInputs() {
        const isUrl = document.getElementById('sourceUrl').checked;
        const fileContainer = document.getElementById('fileInputContainer');
        const urlContainer = document.getElementById('urlInputContainer');

        if (isUrl) {
            fileContainer.classList.add('d-none');
            urlContainer.classList.remove('d-none');
            // Limpiamos el archivo si decide usar URL
            fileContainer.querySelector('input').value = '';
        } else {
            urlContainer.classList.add('d-none');
            fileContainer.classList.remove('d-none');
            // Limpiamos la URL si decide usar archivo
            urlContainer.querySelector('input').value = '';
        }
    }
</script>

</body>
</html>
