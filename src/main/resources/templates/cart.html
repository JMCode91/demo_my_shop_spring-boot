<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mi Cesta')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/header}"></header>

<main class="container py-5">
    <h2 class="mb-4 fw-bold">🛒 Mi Cesta de la Compra</h2>

    <div class="alert alert-info text-center shadow-sm py-5" th:if="${carrito == null or carrito.isEmpty()}">
        <h4 class="alert-heading mb-3">Tu cesta está vacía</h4>
        <p>¡Parece que aún no has añadido ningún producto!</p>
        <a href="/" class="btn btn-primary mt-2">Volver a la tienda</a>
    </div>

    <div class="card shadow-sm border-0" th:if="${carrito != null and !carrito.isEmpty()}">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-4">Producto</th>
                        <th scope="col" class="text-center">Precio Unidad</th>
                        <th scope="col" class="text-center">Cantidad</th>
                        <th scope="col" class="text-end pe-4">Subtotal</th>
                        <th scope="col" class="text-center">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${carrito}">
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center">
                                <img th:src="@{'/images/' + ${item.product.image}}" alt="Imagen" class="img-fluid rounded shadow-sm" style="width: 100px; height: 100px; object-fit: contain; background-color: white;">
                                <a th:href="@{/product/{id}(id=${item.product.id})}" class="fw-bold text-dark text-decoration-none" th:text="${item.product.name}">Nombre</a>
                            </div>
                        </td>
                        <td class="text-center" th:text="${item.product.price} + ' €'">0.00 €</td>
                        <td class="align-middle text-center">
                            <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" class="d-flex align-items-center justify-content-center m-0">
                                <input type="number" name="cantidad" th:value="${item.quantity}" min="0" class="form-control form-control-sm text-center me-2 shadow-sm" style="width: 70px;">

                                <button type="submit" class="btn btn-sm btn-outline-primary shadow-sm" title="Actualizar cantidad">
                                    🔄
                                </button>
                            </form>
                        </td>
                        <td class="text-end pe-4 fw-bold text-success" th:text="${item.price} + ' €'">0.00 €</td>
                        <td class="text-center">
                            <a th:href="@{/cart/remove/{id}(id=${item.product.id})}" class="btn btn-sm btn-outline-danger" title="Eliminar producto">
                                🗑️
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white p-4 d-flex justify-content-between align-items-center">
            <a href="/" class="btn btn-outline-secondary">Seguir comprando</a>
            <div class="text-end">
                <span class="text-muted me-3">Total a pagar:</span>
                <span class="fs-3 fw-bold text-success" th:text="${total} + ' €'">0.00 €</span>
                <a href="/checkout" class="btn btn-success btn-lg ms-4 shadow-sm">
                    Tramitar Pedido 💳
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
