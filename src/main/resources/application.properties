spring.application.name=demo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Ocultación de credenciales de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:myshop}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Limpieza de logs en producción (Apagamos el SQL por consola)
spring.jpa.show-sql=false

# Configuración de ficheros de texto para i18n
spring.messages.basename=lang/res
spring.messages.encoding=UTF-8


spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.batch.job.name=importProductJobV3

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:nube_local}
cloudinary.api-key=${CLOUDINARY_API_KEY:clave_local}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secreto_local}


server.address=127.0.0.1