spring.application.name=demo

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORREGIDO: Puerto 3306 y zona horaria UTC
spring.datasource.url=jdbc:mysql://localhost:3306/myshop?serverTimezone=UTC
spring.datasource.username=admin_tienda
spring.datasource.password=jamofe20191

# Limpieza de logs en producción (Apagamos el SQL por consola)
spring.jpa.show-sql=false

# Configuración de ficheros de texto para i18n
spring.messages.basename=lang/res
spring.messages.encoding=UTF-8


spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
spring.batch.job.name=importProductJobV3

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:nube_local}
cloudinary.api-key=${CLOUDINARY_API_KEY:clave_local}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secreto_local}