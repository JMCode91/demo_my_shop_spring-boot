spring.application.name=demo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORREGIDO: Puerto 3306 y zona horaria UTC
spring.datasource.url=jdbc:mysql://localhost:3307/myshop?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Configuración de ficheros de texto para i18n
spring.messages.basename=lang/res
spring.messages.encoding=UTF-8


spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true
spring.batch.job.name=importProductJobV3

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:nube_local}
cloudinary.api-key=${CLOUDINARY_API_KEY:clave_local}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secreto_local}